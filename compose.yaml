services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?Configura ODOO_DB_PASSWORD}
      TRACCAR_DB_NAME: traccar
      TRACCAR_DB_USER: ${TRACCAR_DB_USER:-traccar}
      TRACCAR_DB_PASSWORD: ${TRACCAR_DB_PASSWORD:?Configura TRACCAR_DB_PASSWORD}
    volumes:
      - postgres_odoo_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:16.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?Configura ODOO_DB_PASSWORD}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons

  traccar:
    image: traccar/traccar:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/entrypoint-custom.sh"]
    ports:
      - "127.0.0.1:8082:8082"
      - "5055:5055"
    environment:
      TRACCAR_DB_HOST: db
      TRACCAR_DB_PORT: "5432"
      TRACCAR_DB_NAME: traccar
      TRACCAR_DB_USER: ${TRACCAR_DB_USER:-traccar}
      TRACCAR_DB_PASSWORD: ${TRACCAR_DB_PASSWORD:?Configura TRACCAR_DB_PASSWORD}
    volumes:
      - ./traccar/entrypoint.sh:/entrypoint-custom.sh:ro
      - traccar_data:/opt/traccar/data
      - traccar_logs:/opt/traccar/logs

volumes:
  postgres_odoo_data:
  odoo_data:
  traccar_data:
  traccar_logs:
