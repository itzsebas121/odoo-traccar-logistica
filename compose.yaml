services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?Configura ODOO_DB_PASSWORD}
      TRACCAR_DB_NAME: traccar
      TRACCAR_DB_USER: ${TRACCAR_DB_USER:-traccar}
      TRACCAR_DB_PASSWORD: ${TRACCAR_DB_PASSWORD:?Configura TRACCAR_DB_PASSWORD}
    volumes:
      - postgres_odoo_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo-init:
    image: odoo:16.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?Configura ODOO_DB_PASSWORD}
    volumes:
      - ./odoo/addons:/mnt/extra-addons
    command: >-
      odoo --db_host=db --db_port=5432 --db_user=odoo
      --db_password=${ODOO_DB_PASSWORD}
      -d ${ODOO_DB:-logistica_dev}
      -i contacts,fleet,sale_management,website,website_sale,payment_custom,
      logistica_base,logistica_despacho,logistica_traccar,logistica_entregas,
      logistica_checkout,logistica_conductor,logistica_analitica_ia
      --without-demo=all --stop-after-init

  odoo:
    image: odoo:16.0
    restart: unless-stopped
    depends_on:
      odoo-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      # Acceso desde otros dispositivos de la red local (por ejemplo, el celular).
      - "8069:8069"
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?Configura ODOO_DB_PASSWORD}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  traccar:
    image: traccar/traccar:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/entrypoint-custom.sh"]
    ports:
      - "8082:8082"
      - "5055:5055"
    environment:
      TRACCAR_DB_HOST: db
      TRACCAR_DB_PORT: "5432"
      TRACCAR_DB_NAME: traccar
      TRACCAR_DB_USER: ${TRACCAR_DB_USER:-traccar}
      TRACCAR_DB_PASSWORD: ${TRACCAR_DB_PASSWORD:?Configura TRACCAR_DB_PASSWORD}
    volumes:
      - ./traccar/entrypoint.sh:/entrypoint-custom.sh:ro
      - traccar_data:/opt/traccar/data
      - traccar_logs:/opt/traccar/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/api/server"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- Servicios de analítica y rutas (ver docs/superpowers/plans) ---

  routing:
    build: ./services/routing
    restart: unless-stopped
    environment:
      ROUTING_OSRM_URL: ${ROUTING_OSRM_URL:-https://router.project-osrm.org}
      ROUTING_TIME_LIMIT_S: ${ROUTING_TIME_LIMIT_S:-5}
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  ml:
    build: ./services/ml
    profiles: ["analitica"]
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/models
      DATA_DIR: /app/data
      # Lectura del DWH con el rol dwh_ro (solo logistica_dwh). Vacia = no hay usuario de lectura todavia.
      DWH_DSN: postgresql://dwh_ro:${DWH_DB_PASSWORD:-}@db:5432/logistica_dwh
    volumes:
      - ./services/ml/models:/app/models
      - ./services/ml/data:/app/data
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  etl:
    build: ./services/etl
    profiles: ["etl"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: logistica_dev
      ODOO_USER: admin
      # OBLIGATORIA, sin valor por defecto: se toma de .env (o del entorno). Se deja sin interpolar con ":?" porque
      # Compose evalua las variables de TODOS los servicios, aunque su perfil este inactivo, y un ":?" aqui haria
      # fallar cualquier `docker compose` del proyecto mientras .env no la defina. Si falta, el ETL termina con
      # un error de configuracion claro (etl.config.require).
      ODOO_PASSWORD: ${ODOO_PASSWORD:-${ODOO_ADMIN_PASSWORD:?Configura ODOO_ADMIN_PASSWORD}}
      TRACCAR_URL: http://traccar:8082
      TRACCAR_USER: ${TRACCAR_ADMIN_EMAIL:-admin@logistica.local}
      TRACCAR_PASSWORD: ${TRACCAR_ADMIN_PASSWORD:?Configura TRACCAR_ADMIN_PASSWORD}
      # Administracion (solo bootstrap): crea las bases y los roles. Usa el superusuario odoo.
      DWH_ADMIN_DSN: postgresql://odoo:${ODOO_DB_PASSWORD:?Configura ODOO_DB_PASSWORD}@db:5432/postgres
      # Conexiones de ejecucion: una base por componente, cada una con su propio rol (R26).
      DB_HOST: db
      DB_PORT: "5432"
      STAGING_DB: logistica_staging
      STAGING_USER: etl_stg
      ETL_STG_PASSWORD: ${ETL_STG_PASSWORD:-}
      DWH_DB: logistica_dwh
      DWH_ETL_USER: dwh_etl
      DWH_ETL_PASSWORD: ${DWH_ETL_PASSWORD:-}
      # Vacia = no se crea el rol de solo lectura dwh_ro
      DWH_DB_PASSWORD: ${DWH_DB_PASSWORD:-}

  seed:
    image: python:3.12-slim
    depends_on:
      odoo:
        condition: service_healthy
      traccar:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app:ro
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-logistica_dev}
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_PASSWORD:
      TRACCAR_URL: http://traccar:8082
      TRACCAR_INTERNAL_URL: http://traccar:8082
      TRACCAR_ADMIN_EMAIL: ${TRACCAR_ADMIN_EMAIL:?Configura TRACCAR_ADMIN_EMAIL}
      TRACCAR_ADMIN_PASSWORD: ${TRACCAR_ADMIN_PASSWORD:?Configura TRACCAR_ADMIN_PASSWORD}
      INTEGRATION_TRACCAR_EMAIL: ${INTEGRATION_TRACCAR_EMAIL:?Configura INTEGRATION_TRACCAR_EMAIL}
      INTEGRATION_TRACCAR_PASSWORD: ${INTEGRATION_TRACCAR_PASSWORD:?Configura INTEGRATION_TRACCAR_PASSWORD}
      DEMO_CONDUCTOR_PASSWORD: ${DEMO_CONDUCTOR_PASSWORD:?Configura DEMO_CONDUCTOR_PASSWORD}
    command: ["python", "seeds/seed.py"]

  bi:
    build: ./services/bi
    profiles: ["analitica"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DWH_HOST: db
      DWH_PORT: "5432"
      DWH_NAME: logistica_dwh
      DWH_USER: dwh_ro
      # OBLIGATORIA, sin valor por defecto: se toma de .env (o del entorno). No se usa ":?" por la misma razon que
      # en etl. Si falta, la aplicacion muestra un error claro en espanol (olap.ConfigError).
      DWH_DB_PASSWORD:
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_odoo_data:
  odoo_data:
  traccar_data:
  traccar_logs:
