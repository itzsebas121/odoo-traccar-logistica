services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?Configura ODOO_DB_PASSWORD}
      TRACCAR_DB_NAME: traccar
      TRACCAR_DB_USER: ${TRACCAR_DB_USER:-traccar}
      TRACCAR_DB_PASSWORD: ${TRACCAR_DB_PASSWORD:?Configura TRACCAR_DB_PASSWORD}
    volumes:
      - postgres_odoo_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo-init:
    image: odoo:16.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?Configura ODOO_DB_PASSWORD}
      ODOO_DB: ${ODOO_DB:-logistica_dev}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?Configura ODOO_ADMIN_PASSWORD}
    volumes:
      - ./odoo/addons:/mnt/extra-addons
      - ./odoo/init:/opt/logistica-init:ro
    # Instala los modulos solo en una base nueva y aplica ODOO_ADMIN_PASSWORD (ver odoo/init/odoo-init.sh).
    entrypoint: ["/bin/bash", "/opt/logistica-init/odoo-init.sh"]

  odoo:
    image: odoo:16.0
    restart: unless-stopped
    depends_on:
      odoo-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      # Acceso desde otros dispositivos de la red local (por ejemplo, el celular).
      - "8069:8069"
    # 8072 (websocket / bus de Odoo con workers > 0): el proxy debe enviar /websocket a este puerto.
    expose:
      - "8072"
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?Configura ODOO_DB_PASSWORD}
      ODOO_DB: ${ODOO_DB:-logistica_dev}
      ODOO_RC: /tmp/odoo.conf
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:?Configura ODOO_MASTER_PASSWORD}
      ODOO_PROXY_MODE: ${ODOO_PROXY_MODE:-False}
      ODOO_WORKERS: ${ODOO_WORKERS:-2}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
      - ./odoo/init:/opt/logistica-init:ro
    # Genera /tmp/odoo.conf (sin gestor de bases publico, contrasena maestra, workers, limites, proxy_mode).
    entrypoint: ["/bin/bash", "/opt/logistica-init/odoo-entrypoint.sh"]
    command: ["odoo"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  traccar:
    image: traccar/traccar:6.17  # version fija: una nueva puede cambiar esquema o API sin aviso
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/entrypoint-custom.sh"]
    ports:
      - "8082:8082"
      # OsmAnd (Traccar Client). En local el teléfono usa http://<IP-del-PC>:5055. En producción, detrás de Cloudflare,
      # este puerto no pasa: los teléfonos entran por el dominio HTTPS «gps» (Traefik → traccar:5055). Ver README.
      - "5055:5055"
    environment:
      TRACCAR_DB_HOST: db
      TRACCAR_DB_PORT: "5432"
      TRACCAR_DB_NAME: traccar
      TRACCAR_DB_USER: ${TRACCAR_DB_USER:-traccar}
      TRACCAR_DB_PASSWORD: ${TRACCAR_DB_PASSWORD:?Configura TRACCAR_DB_PASSWORD}
    volumes:
      - ./traccar/entrypoint.sh:/entrypoint-custom.sh:ro
      - traccar_data:/opt/traccar/data
      - traccar_logs:/opt/traccar/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/api/server"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- Servicios de analítica y rutas (ver docs/superpowers/plans) ---

  routing:
    build: ./services/routing
    restart: unless-stopped
    environment:
      ROUTING_OSRM_URL: ${ROUTING_OSRM_URL:-https://router.project-osrm.org}
      ROUTING_TIME_LIMIT_S: ${ROUTING_TIME_LIMIT_S:-5}
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  ml: &ml
    build:
      context: ./services/ml
      target: produccion
    profiles: ["analitica"]
    restart: unless-stopped
    environment: &ml-env
      MODEL_DIR: /app/models
      DATA_DIR: /app/data
      ANALISIS_DIR: /app/analisis
      # Conexion al DWH por partes (la clave puede tener cualquier caracter). Lectura con dwh_ro; escritura de
      # resultados (tablas ml_*) con dwh_ml. Vacias = sin usuario todavia (ver .env.example).
      DWH_HOST: db
      DWH_PORT: "5432"
      DWH_NAME: logistica_dwh
      DWH_USER: dwh_ro
      DWH_DB_PASSWORD: ${DWH_DB_PASSWORD:-}
      DWH_ML_USER: dwh_ml
      DWH_ML_PASSWORD: ${DWH_ML_PASSWORD:-}
    volumes:
      - ./services/ml/models:/app/models
      - ./services/ml/data:/app/data
      - ./services/ml/analisis:/app/analisis
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Pronostico de demanda en el SERVIDOR con el modelo entrenado en local (models/demanda.joblib, va en el repo).
  # No entrena: lee las ventas del DWH, predice los proximos 7 dias y escribe ml_pronostico_demanda (y la
  # comparativa de analisis/ en ml_evaluacion_modelos). Correrlo despues de cada `etl run` (o con cron del host):
  #   docker compose --profile analitica run --rm ml-predecir
  ml-predecir:
    <<: *ml
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    ports: []
    healthcheck:
      disable: true
    command: ["python", "-m", "mlsvc.demanda.predecir", "--source", "dwh"]

  # Comparativa de modelos de demanda con TODAS las herramientas (baselines, estadisticos, ML, deep learning,
  # fundacional). Imagen pesada. SOLO EN LOCAL (el servidor no entrena):
  #   docker compose --profile benchmark run --rm ml-benchmark
  #   docker compose --profile benchmark run --rm ml-benchmark python -m mlsvc.demanda.train --source dwh
  # La misma imagen base que produccion (requirements.txt): el modelo guardado carga igual en el servidor.
  # Deja la tabla en services/ml/analisis/comparativa_modelos.md, el modelo en services/ml/models/demanda.joblib
  # (se commitea) y, en el DWH local, ml_evaluacion_modelos y ml_pronostico_demanda.
  ml-benchmark:
    <<: *ml
    build:
      context: ./services/ml
      target: benchmark
    image: logistica-ml-benchmark
    profiles: ["benchmark"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *ml-env
      # Pasos de entrenamiento de las redes de neuralforecast (mas = mejor ajuste y mas lento en CPU).
      BENCH_PASOS_DL: ${BENCH_PASOS_DL:-300}
      PROPHET_MAX_SERIES: ${PROPHET_MAX_SERIES:-800}
    ports: []
    healthcheck:
      disable: true
    command: ["python", "-m", "mlsvc.demanda.benchmark", "--source", "dwh"]

  # ETL bajo demanda: `docker compose --profile etl run --rm etl <comando>` (ver services/etl/README.md).
  etl: &etl
    build: ./services/etl
    image: logistica-etl
    profiles: ["etl"]
    depends_on:
      db:
        condition: service_healthy
    environment: &etl-env
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-logistica_dev}
      ODOO_USER: admin
      # OBLIGATORIA, sin valor por defecto: ODOO_PASSWORD de .env o, si esta vacia, ODOO_ADMIN_PASSWORD. Ojo: el
      # ":?" solo se evalua cuando ODOO_PASSWORD falta, pero entonces hace fallar CUALQUIER `docker compose` del
      # proyecto (Compose interpola todos los servicios, aunque su perfil este inactivo). Basta con definir una de
      # las dos en .env.
      ODOO_PASSWORD: ${ODOO_PASSWORD:-${ODOO_ADMIN_PASSWORD:?Configura ODOO_ADMIN_PASSWORD}}
      TRACCAR_URL: http://traccar:8082
      TRACCAR_USER: ${TRACCAR_ADMIN_EMAIL:-admin@logistica.local}
      TRACCAR_PASSWORD: ${TRACCAR_ADMIN_PASSWORD:?Configura TRACCAR_ADMIN_PASSWORD}
      # Administracion (solo bootstrap): crea las bases y los roles. Usa el superusuario odoo.
      DWH_ADMIN_DSN: postgresql://odoo:${ODOO_DB_PASSWORD:?Configura ODOO_DB_PASSWORD}@db:5432/postgres
      # Conexiones de ejecucion: una base por componente, cada una con su propio rol (R26).
      DB_HOST: db
      DB_PORT: "5432"
      STAGING_DB: logistica_staging
      STAGING_USER: etl_stg
      ETL_STG_PASSWORD: ${ETL_STG_PASSWORD:-}
      DWH_DB: logistica_dwh
      DWH_ETL_USER: dwh_etl
      DWH_ETL_PASSWORD: ${DWH_ETL_PASSWORD:-}
      # Vacia = no se crea el rol de solo lectura dwh_ro
      DWH_DB_PASSWORD: ${DWH_DB_PASSWORD:-}
      # Vacia = no se crea el rol dwh_ml (el ML no guarda la comparativa ni los pronosticos en el DWH)
      DWH_ML_PASSWORD: ${DWH_ML_PASSWORD:-}
      # Operacion (no secretas; vacias = valor por defecto del ETL).
      ETL_TZ: ${ETL_TZ:-America/Guayaquil}
      ETL_INTERVAL_MIN: ${ETL_INTERVAL_MIN:-15}
      ETL_FULL_HOURS: ${ETL_FULL_HOURS:-24}
      ETL_RETENTION_DAYS: ${ETL_RETENTION_DAYS:-30}
      ETL_TRACCAR_DAYS: ${ETL_TRACCAR_DAYS:-30}
      # Segundos de espera por cada informe de Traccar (subir con mucho historico GPS).
      ETL_TRACCAR_TIMEOUT_S: ${ETL_TRACCAR_TIMEOUT_S:-30}

  # ETL periodico: una corrida cada ETL_INTERVAL_MIN minutos. Necesita las bases creadas (`etl bootstrap`).
  # Un fallo de una corrida se registra y se reintenta en el siguiente ciclo; el contenedor no se reinicia.
  etl-scheduler:
    <<: *etl
    profiles: ["analitica"]
    restart: unless-stopped
    command: ["schedule"]
    environment:
      <<: *etl-env
    healthcheck:
      test: ["CMD", "python", "-m", "etl", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  seed:
    image: python:3.12-slim
    depends_on:
      odoo:
        condition: service_healthy
      traccar:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app:ro
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-logistica_dev}
      ODOO_USER: ${ODOO_USER:-admin}
      # Vacia = la misma que ODOO_ADMIN_PASSWORD (la que odoo-init aplica al usuario admin).
      ODOO_PASSWORD: ${ODOO_PASSWORD:-${ODOO_ADMIN_PASSWORD}}
      TRACCAR_URL: http://traccar:8082
      TRACCAR_INTERNAL_URL: http://traccar:8082
      TRACCAR_ADMIN_EMAIL: ${TRACCAR_ADMIN_EMAIL:?Configura TRACCAR_ADMIN_EMAIL}
      TRACCAR_ADMIN_PASSWORD: ${TRACCAR_ADMIN_PASSWORD:?Configura TRACCAR_ADMIN_PASSWORD}
      INTEGRATION_TRACCAR_EMAIL: ${INTEGRATION_TRACCAR_EMAIL:?Configura INTEGRATION_TRACCAR_EMAIL}
      INTEGRATION_TRACCAR_PASSWORD: ${INTEGRATION_TRACCAR_PASSWORD:?Configura INTEGRATION_TRACCAR_PASSWORD}
      DEMO_CONDUCTOR_PASSWORD: ${DEMO_CONDUCTOR_PASSWORD:?Configura DEMO_CONDUCTOR_PASSWORD}
      SEED_HISTORIAL: ${SEED_HISTORIAL:-true}
    command: ["python", "seeds/seed.py"]

  # Asistente del administrador (chat con GPT de OpenAI + interfaz React). Lee Odoo con permisos de solo consulta.
  agente:
    build: ./services/agente
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      odoo:
        condition: service_healthy
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-logistica_dev}
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-${ODOO_ADMIN_PASSWORD}}
      # Sin clave el servicio arranca igual y avisa en el chat.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENTE_MODELO: ${AGENTE_MODELO:-gpt-6.1-sol}
      # Vacia = no se envia el nivel de razonamiento (para modelos que no lo admiten)
      AGENTE_ESFUERZO: ${AGENTE_ESFUERZO-medium}
      AGENTE_SESSION_SECRET: ${AGENTE_SESSION_SECRET:?Configura AGENTE_SESSION_SECRET (openssl rand -hex 32)}
      # true con HTTPS (produccion); false solo en local por http://
      AGENTE_COOKIE_SEGURA: ${AGENTE_COOKIE_SEGURA:-true}
      # IPs del proxy en las que se confia para X-Forwarded-For (Traefik en Dokploy: su red, o "*" si 8000 no se publica)
      FORWARDED_ALLOW_IPS: ${AGENTE_FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Seccion «Base de datos»: respaldos y restauracion (pg_dump/pg_restore con el usuario odoo de PostgreSQL).
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: ${ODOO_DB_PASSWORD:?Configura ODOO_DB_PASSWORD}
      TRACCAR_DB_NAME: traccar
      TRACCAR_DB_USER: ${TRACCAR_DB_USER:-traccar}
      # Cada respaldo/restauracion pide la contrasena maestra de Odoo.
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:?Configura ODOO_MASTER_PASSWORD}
      AGENTE_MAX_SUBIDA_MB: ${AGENTE_MAX_SUBIDA_MB:-2048}
      # Tablero: lee las vistas v_bi_* del DWH con el rol de solo lectura dwh_ro (vacia = el tablero avisa).
      DWH_HOST: db
      DWH_PORT: "5432"
      DWH_NAME: logistica_dwh
      DWH_USER: dwh_ro
      DWH_DB_PASSWORD: ${DWH_DB_PASSWORD:-}
    volumes:
      # Filestore de Odoo (adjuntos): va dentro de los respaldos y se reemplaza al restaurar.
      - odoo_data:/var/lib/odoo
      # Respaldos guardados en el servidor (sobreviven a los redespliegues).
      - respaldos:/respaldos
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/salud',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # GPS del historial de demostracion en Traccar: toma de Odoo las rutas cerradas del historial que carga `seed`
  # (modulo logistica_demo, SEED_HISTORIAL=true) y manda sus posiciones por OsmAnd con la hora de cada ruta.
  # Necesita antes `seed`. Bajo demanda (despues, `etl run --mode full`):
  #   docker compose --profile historico run --rm gps-historico [--dias N] [--forzar] [--plan]
  gps-historico:
    image: python:3.12-slim
    profiles: ["historico"]
    depends_on:
      odoo:
        condition: service_healthy
      traccar:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app:ro
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-logistica_dev}
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-${ODOO_ADMIN_PASSWORD}}
      TRACCAR_OSMAND_URL: http://traccar:5055
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["python", "seeds/gps_historico.py"]

  bi:
    build: ./services/bi
    profiles: ["analitica"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DWH_HOST: db
      DWH_PORT: "5432"
      DWH_NAME: logistica_dwh
      DWH_USER: dwh_ro
      # OBLIGATORIA, sin valor por defecto: se toma de .env (o del entorno). No se usa ":?" por la misma razon que
      # en etl. Si falta, la aplicacion muestra un error claro en espanol (olap.ConfigError).
      DWH_DB_PASSWORD:
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  respaldos:
  postgres_odoo_data:
  odoo_data:
  traccar_data:
  traccar_logs:
